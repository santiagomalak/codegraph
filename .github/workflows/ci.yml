name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Chequeo end-to-end: el CLI se analiza a sí mismo y no debe tener ciclos.
      - run: node packages/cli/dist/index.js analyze packages/core/src --fail-on-cycles
